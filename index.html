<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XenzHub</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #12161f;
      --border: #232a38;
      --text: #e6e9f0;
      --muted: #8a93a6;
      --accent: #6c5ce7;
      --accent-2: #00d2ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .badge {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-2);
      background: rgba(0, 210, 255, 0.08);
      border: 1px solid rgba(0, 210, 255, 0.25);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 28px;
    }
    h1 {
      font-size: clamp(40px, 8vw, 76px);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, #fff 20%, var(--accent) 60%, var(--accent-2) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    p {
      color: var(--muted);
      font-size: 17px;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 36px;
    }
    .links {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      text-decoration: none;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .btn:hover { border-color: var(--accent); transform: translateY(-1px); }
    .btn.primary {
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      border: none;
      color: #fff;
      font-weight: 600;
    }
    footer {
      margin-top: 64px;
      color: var(--muted);
      font-size: 13px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="badge">Coming soon</div>
  <h1>XenzHub</h1>
  <p>Something new is on the way. This is the home of <strong>xenzhub.app</strong>.</p>
  <div class="links">
    <a class="btn primary" href="mailto:hello@xenzhub.app">Contact</a>
    <a class="btn" href="https://github.com/xcodelol">GitHub</a>
  </div>
  <footer>&copy; 2026 XenzHub</footer>
</body>
</html>
